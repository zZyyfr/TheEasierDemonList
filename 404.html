<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>404 - Page Not Found | The Easier Demon List</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />

        <style>
            .notfound-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 6rem 1rem;
            }
            .notfound-box {
                background-color: var(--color-background, #1e1e1e);
                color: var(--color-on-background, #fff);
                padding: 3rem;
                border-radius: 0.5rem;
                width: 100%;
                max-width: 48rem;
                box-sizing: border-box;
                border: 1px solid var(--color-border, #333);
            }
            .notfound-box h1 {
                font-size: 5rem;
                color: var(--color-primary, #e74c3c);
                margin: 0 0 1rem 0;
            }
            .notfound-box h2 {
                margin-bottom: 0.5rem;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .notfound-box p {
                color: var(--color-subtext, #aaa);
                margin-bottom: 2rem;
                font-size: 1rem;
            }
            .notfound-box a.btn-home {
                display: inline-block;
                background-color: var(--color-primary, #e74c3c);
                color: var(--color-on-primary, #fff);
                text-decoration: none;
                border-radius: 0.5rem;
                padding: 1rem 2rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                transition: background 0.2s;
            }
            .notfound-box a.btn-home:hover {
                background-color: var(--color-background-hover, #c0392b);
            }
        </style>
    </head>
    <body id="app">
        <header>
            <div class="logo">
                <h2>The Easier Demon List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <a class="nav__tab" href="/">
                    <span class="type-label-lg">List</span>
                </a>
                <a class="nav__tab" href="/#leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </a>
                <div class="nav__actions">
                    <a class="nav__icon" href="#" target="_blank">
                        <img src="/assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <a class="nav__cta type-label-lg" href="/submit.html">Submit Record</a>
                </div>
            </nav>
        </header>

        <div class="notfound-wrapper">
            <div class="notfound-box">
                <h1>404</h1>
                <h2>Page Not Found</h2>
                <p>Oops! The level or page you are looking for doesn't exist or has been deleted.</p>
                <a href="/" class="btn-home">Return to List</a>
            </div>
        </div>
    </body>
</html>
